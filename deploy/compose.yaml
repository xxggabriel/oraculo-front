name: oraculo-search
services:
  backend:
    build:
      context: ../../oraculo-back
      dockerfile: ../oraculo-front/deploy/backend.Dockerfile
    restart: unless-stopped
    network_mode: host
    env_file: /home/gabriel/.config/oraculo-search/private/backend-deploy.env
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      ES_URL: https://127.0.0.1:9200
      ES_CA_FILE: /run/oraculo/elasticsearch-ca.crt
      ES_INDEX_PREFIX: oraculo-
      ES_ALIAS_MODE: current
      ALLOW_TEST_HTTP: 'false'
      CORS_ORIGINS: http://192.168.100.27:4200,http://localhost:4200,http://127.0.0.1:4200
    volumes:
      - /home/gabriel/.config/oraculo-search/private/elasticsearch-ca.crt:/run/oraculo/elasticsearch-ca.crt:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    network_mode: host
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:4200/health/ready]
      interval: 30s
      timeout: 10s
      retries: 3
